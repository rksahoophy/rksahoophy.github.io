name: Sync Google Scholar

# Every Monday at 05:17 UTC, and whenever you press "Run workflow" on the Actions tab.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Scholar profile
        run: python3 tools/sync_scholar.py
      - name: Commit if anything changed
        run: |
          git config user.name "scholar-sync"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/scholar.json
          git diff --cached --quiet || git commit -m "Update Google Scholar data"
          git push
