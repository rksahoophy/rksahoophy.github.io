name: Update Scholar data and CV PDF

# Runs every Monday at 05:17 UTC, whenever you press "Run workflow" on the Actions tab,
# and after every change you push (the PDF is then rebuilt if the CV content changed;
# Scholar is also read on a push while the citation chart has no data yet).
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/cv/**"
      - "assets/data/scholar.json"

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Scholar is read on the weekly/manual runs, and also on a push whenever the
      # citations-per-year data is still missing (so the chart appears on first publish).
      - name: Check for citations-per-year data
        id: chart
        run: |
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('assets/data/scholar.json')).get('perYear') else 1)"; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Google Scholar profile
        if: github.event_name != 'push' || steps.chart.outputs.missing == 'true'
        run: python3 tools/sync_scholar.py

      - name: Rebuild the CV PDF from the website
        run: bash tools/build_cv_pdf.sh

      - name: Commit if anything changed
        run: |
          git config user.name "site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/scholar.json assets/cv/
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Update Scholar data and CV PDF"
          git pull --rebase
          git push
